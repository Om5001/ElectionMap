name: Forecast

on:
  schedule:
    - cron: "*/20 * * * *"            # normal days: every 20 min
    - cron: "*/5 22,23 3 11 *"         # election night, Nov 3 22:00-23:59 UTC (5 pm ET onward)
    - cron: "*/5 0-14 4 11 *"          # through Nov 4 14:00 UTC (9 am ET)
    - cron: "*/10 * 5-7 11 *"          # late counting, Nov 5-7
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets (Settings -> Secrets and variables -> Actions -> Secrets). All optional.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      AP_API_KEY: ${{ secrets.AP_API_KEY }}
      # Variables (same page -> Variables). All optional.
      POLLS_CSV_URL: ${{ vars.POLLS_CSV_URL }}
      RESULTS_CSV_URL: ${{ vars.RESULTS_CSV_URL }}
      RESULTS_JSON_URL: ${{ vars.RESULTS_JSON_URL }}
      EARLY_VOTE_CSV_URL: ${{ vars.EARLY_VOTE_CSV_URL }}
      GENERIC_BALLOT_D_MARGIN: ${{ vars.GENERIC_BALLOT_D_MARGIN || '8.7' }}
      # Keeps the probability history growing across runs (the previous deploy's history.json).
      HISTORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/history.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache CV results and district lean
        uses: actions/cache@v4
        with:
          path: |
            data/cache/cv.json
            data/reference/house_district_lean.csv
          key: forecast-cache-${{ hashFiles('data/reference/538_raw_polls.csv', 'forecast/model/**') }}
      - name: District lean (all 435 seats), best effort
        run: test -f data/reference/house_district_lean.csv || python scripts/fetch_district_lean.py || echo "district lean unavailable - House uses market/poll districts only"
      - name: Run pipeline
        run: python -m forecast.pipeline
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
